<title id="t">Smart File Organizer</title>
<desc id="d">Project card: Smart File Organizer</desc>
<style>.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:Consolas,'SF Mono','Courier New',monospace}</style>
<defs><radialGradient id="gl"><stop offset="0" stop-color="#34D399" stop-opacity=".35"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="cc"><rect x="1.5" y="1.5" width="377" height="207" rx="16"/></clipPath></defs>
<rect x="1.5" y="1.5" width="377" height="207" rx="16" fill="#0A1230" stroke="#34D399" stroke-opacity=".35" stroke-width="1.5"/><g clip-path="url(#cc)"><circle cx="340" cy="40" r="100" fill="url(#gl)"/></g><rect x="1.5" y="1.5" width="377" height="207" rx="16" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" pathLength="1000" stroke-dasharray="110 890"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="6s" begin="2.4s" repeatCount="indefinite"/></rect><g clip-path="url(#cc)"><rect x="-140" y="0" width="90" height="210" fill="url(#sh)" transform="skewX(-18)"><animate attributeName="x" values="-140;-140;480" keyTimes="0;.35;1" dur="6s" begin="2.4s" repeatCount="indefinite"/></rect></g><text class="sans" x="24" y="44" font-size="13" font-weight="700" fill="#34D399">Automation</text><text class="sans" x="24" y="78" font-size="21" font-weight="700" fill="#F1F5F9">Smart File Organizer</text><text class="sans" x="24" y="108" font-size="14" fill="#94A3B8">Sorts mixed files into categories and</text><text class="sans" x="24" y="130" font-size="14" fill="#94A3B8">resolves name collisions without</text><text class="sans" x="24" y="152" font-size="14" fill="#94A3B8">losing any data.</text><rect x="24" y="172" width="64" height="24" rx="12" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".5"/><text class="sans" x="35" y="189" font-size="12" fill="#E2E8F0">Python</text><rect x="96" y="172" width="71" height="24" rx="12" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".5"/><text class="sans" x="107" y="189" font-size="12" fill="#E2E8F0">pathlib</text><rect x="175" y="172" width="64" height="24" rx="12" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".5"/><text class="sans" x="186" y="189" font-size="12" fill="#E2E8F0">shutil</text>
